# Cloud Discovery Only Configuration
# For discovering cloud database infrastructure

providers:
  aws:
    enabled: true
    regions:
      - us-west-2
      - us-east-1
    credentials:
      # Option 1: Use AWS profile
      profile: migration-discovery

      # Option 2: Direct credentials (not recommended for production)
      # access_key_id: your_access_key
      # secret_access_key: your_secret_key

      # Option 3: Cross-account role assumption
      # role_arn: arn:aws:iam::123456789012:role/PlanetScaleMigrationRole
      # external_id: unique-external-id

    resources:
      # Specific resources to analyze (optional)
      rds_instances:
        - db-prod-1
        - db-staging-1
      aurora_clusters:
        - aurora-prod-cluster

    # Set to true to discover all resources
    discover_all: true

  gcp:
    enabled: true
    project_id: your-project-123
    regions:
      - us-central1
      - us-west1
    credentials:
      # Option 1: Service account key file
      service_account_key: path/to/service-account-key.json

      # Option 2: Use Application Default Credentials
      # application_default: true

    resources:
      cloud_sql_instances:
        - prod-db-instance
      alloydb_clusters:
        - prod-alloydb-cluster

    discover_all: true

  azure:
    enabled: true
    subscription_id: 22222222-2222-2222-2222-222222222222
    # A filter on each resource's own location.
    # Omit it to discover every region.
    regions:
      - eastus
      - westeurope
    # Optional: narrow the scan to specific resource groups. Required if the
    # service principal is scoped to a group rather than the subscription.
    # resource_groups:
    #   - rg-prod-db
    credentials:
      # Option 1: Service principal. Create one with:
      #   az ad sp create-for-rbac --name planetscale-discovery \
      #     --role Reader --scopes /subscriptions/<subscription-id>
      tenant_id: 11111111-1111-1111-1111-111111111111
      client_id: 00000000-0000-0000-0000-000000000000
      client_secret: your-client-secret

      # Option 2: omit the three fields above for ambient credentials from
      # `az login`, a managed identity, or the AZURE_* environment variables.

    resources:
      postgresql_flexible_servers:
        - prod-pg-server
      mysql_flexible_servers:
        - prod-mysql-server

    discover_all: true

output:
  output_dir: ./discovery_output

log_level: INFO