name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0

permissions:
  contents: write  # Required to create releases and upload assets

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: "3.11"

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Building release for version: ${VERSION}"

    - name: Verify every version identifier matches tag
      env:
        TAG_VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        failed=0
        check() {
          if ! grep -Fq -- "$2" "$1"; then
            echo "❌ Error: $1 does not contain: $2"
            failed=1
          fi
        }
        FILE_VERSION=$(tr -d '\n' < VERSION)
        if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
          echo "❌ Error: VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
          failed=1
        fi
        check setup.py                          "version=\"${TAG_VERSION}\","
        check pyproject.toml                    "version = \"${TAG_VERSION}\""
        check planetscale_discovery/__init__.py "__version__ = \"${TAG_VERSION}\""
        check README.md                         "unzip ps-discovery-${TAG_VERSION}.zip"
        check README.md                         "cd ps-discovery-${TAG_VERSION}"
        check docs/workload-bundle.md           "\"discovery_version\": \"${TAG_VERSION}\""
        check CHANGELOG.md                      "## [${TAG_VERSION}]"
        if [ "$failed" -ne 0 ]; then
          echo "Update the files above to ${TAG_VERSION} on main, then tag again."
          exit 1
        fi
        echo "✅ Version verified: $TAG_VERSION"

    - name: Build release zip
      run: |
        chmod +x build_release.sh
        ./build_release.sh ${{ steps.get_version.outputs.version }}

    - name: Verify release artifacts
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        cd dist
        ls -lh
        sha256sum -c "ps-discovery-${VERSION}.zip.sha256"

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.get_version.outputs.version }}" \
          --title "PlanetScale Discovery Tools v${{ steps.get_version.outputs.version }}" \
          --notes-file "dist/ps-discovery-${{ steps.get_version.outputs.version }}/RELEASE_NOTES.txt" \
          "dist/ps-discovery-${{ steps.get_version.outputs.version }}.zip" \
          "dist/ps-discovery-${{ steps.get_version.outputs.version }}.zip.sha256"
